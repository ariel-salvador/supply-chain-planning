[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppsim"
version = "0.1.0"
description = "Product-agnostic supply chain planning engine: S&OP -> MPS -> MRP -> purchasing -> RCCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pandas>=1.5", "numpy>=1.23", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
reports = ["matplotlib>=3.7"]

[project.scripts]
ppsim = "ppsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
