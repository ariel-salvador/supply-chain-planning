# Case 1 - MOCK precision-fermentation plant: recombinant beta-lactoglobulin (rBLG)
# whey protein powder made by Trichoderma reesei fed-batch fermentation.
#
# Structure only. Every number is an id in knowledge/assumptions.csv
# (status cited / estimate / mock). The loader enforces:
#   - BOM quantities and price conversions rest on cited ids only
#   - planning and demand values are registry ids (mock), never raw numbers
# Process background: knowledge/topics/precision-fermentation-process.md

product:
  id: blg_whey_protein
  name: "rBLG whey protein powder - mock precision-fermentation plant"
  mock: true

company:                       # used by the Odoo demo; FICTIONAL
  id: demo_co
  name: "Demo Precision Proteins Co. (fictional)"
  fictional: true

registry: ../knowledge/assumptions.csv

time:
  freq: W-SUN        # weekly buckets, Mon-Sun
  start: "2027-01-04"
  horizon: 26        # MPS / MRP weeks
  sop_months: 12     # S&OP span (monthly)

derived:
  # kg rBLG secreted per kg powder (no UF/DF or drying loss, as in Behm 2022)
  rblg_kg_per_kg_product: rblg_content_of_product / mf_permeate_recovery
  # kg sugar per kg rBLG; yield read as total secreted protein (ADR 0004)
  sugar_kg_per_kg_rblg: 1 / (protein_yield_on_sugar * rblg_fraction_of_secreted_protein)
  fermentation_cycle_h: production_time + turnaround_time
  fermentation_lead_time_weeks: ceil(fermentation_cycle_h / hours_per_week)
  # rBLG per batch: vessel x final working volume (Humbird 2011) x titre = 12,000 kg
  batch_rblg_kg: main_bioreactor_volume * max_working_volume_fraction * final_titre_rblg
  # powder capacity per week: reactors x available hours / batch cycle x batch / (rBLG per kg powder)
  powder_capacity_per_week: mock_production_reactors * hours_per_week * plant_uptime / fermentation_cycle_h * batch_rblg_kg / rblg_kg_per_kg_product
  powder_kg_per_batch: batch_rblg_kg / rblg_kg_per_kg_product
  # media: Humbird Table 20 concentrations per litre of final working volume -> kg per kg rBLG
  nh3_kg_per_kg_rblg: nh3_conc / final_titre_rblg
  ammonium_sulfate_kg_per_kg_rblg: ammonium_sulfate_conc / final_titre_rblg
  potassium_phosphate_kg_per_kg_rblg: potassium_phosphate_conc / final_titre_rblg
  magnesium_sulfate_kg_per_kg_rblg: magnesium_sulfate_conc / final_titre_rblg
  calcium_chloride_kg_per_kg_rblg: calcium_chloride_conc / final_titre_rblg
  bags_per_kg_powder: 1 / bag_net_kg
  # MOCK (ADR 0008): one UF/DF membrane set per N batches
  membrane_sets_per_kg_powder: 1 / (mock_batches_per_membrane_set * powder_kg_per_batch)
  # starch -> glucose mass gain on hydrolysis
  hydrolysis_mass_gain: glucose_molar_mass / anhydroglucose_molar_mass
  # theoretical minimum corn per kg glucose: 100% hydrolysis, no refining losses
  corn_kg_per_glucose_kg: (corn_per_bushel / starch_per_bushel) / hydrolysis_mass_gain

items:
  - id: BLG-PWD
    name: rBLG protein powder (85.8% rBLG)
    type: finished
    uom: kg
    batch_size: powder_kg_per_batch                     # ERP BOM base: powder from one batch
    planning:
      lead_time: mock_pwd_lead_time
      on_hand: mock_pwd_on_hand
      safety_stock: mock_pwd_safety_stock
      scheduled_receipts: {0: mock_pwd_open_order}
      lot_sizing: {rule: lot_for_lot}

  - id: BLG-FERM
    name: rBLG secreted in harvested broth (kg rBLG)
    type: intermediate
    uom: kg
    batch_size: batch_rblg_kg                           # ERP BOM base: one 300 m3 batch
    planning:
      lead_time: fermentation_lead_time_weeks          # from cited cycle time
      scheduled_receipts: {0: mock_ferm_open_batch}
      lot_sizing: {rule: lot_for_lot, multiple: batch_rblg_kg}   # whole batches only

  - id: GLUCOSE
    name: Glucose (corn-derived), carbon source - Behm scenario 1
    type: purchased
    uom: kg
    price:
      series: PMAIZMTUSDM                              # USD per metric ton of corn
      usd_per_uom: PMAIZMTUSDM / kg_per_tonne * corn_kg_per_glucose_kg   # corn content only
    planning: &sugar_planning
      lead_time: mock_sugar_lead_time
      on_hand: mock_sugar_on_hand
      safety_stock: mock_sugar_safety_stock
      scheduled_receipts: {1: mock_sugar_open_po}
      lot_sizing: {rule: fixed_order_quantity, quantity: mock_sugar_order_qty}

  - id: SUCROSE
    name: Sucrose, carbon source - Behm scenario 2
    type: purchased
    uom: kg
    price:
      series: PSUGAISAUSDM                             # US cents per pound, ICE No. 11
      usd_per_uom: PSUGAISAUSDM / cents_per_usd / kg_per_lb
    planning: *sugar_planning

  - id: NH3
    name: Ammonia (nitrogen source)
    type: purchased
    uom: kg
    planning: &nutrient_planning
      lead_time: mock_nutrient_lead_time
      on_hand: mock_start_cover_batches * batch_rblg_kg * nh3_kg_per_kg_rblg
      lot_sizing: {rule: lot_for_lot}

  - id: AMSULF
    name: Ammonium sulfate
    type: purchased
    uom: kg
    planning:
      <<: *nutrient_planning
      on_hand: mock_start_cover_batches * batch_rblg_kg * ammonium_sulfate_kg_per_kg_rblg

  - id: KPHOS
    name: Potassium phosphate
    type: purchased
    uom: kg
    planning:
      <<: *nutrient_planning
      on_hand: mock_start_cover_batches * batch_rblg_kg * potassium_phosphate_kg_per_kg_rblg

  - id: MGSULF
    name: Magnesium sulfate
    type: purchased
    uom: kg
    planning:
      <<: *nutrient_planning
      on_hand: mock_start_cover_batches * batch_rblg_kg * magnesium_sulfate_kg_per_kg_rblg

  - id: CACL2
    name: Calcium chloride
    type: purchased
    uom: kg
    planning:
      <<: *nutrient_planning
      on_hand: mock_start_cover_batches * batch_rblg_kg * calcium_chloride_kg_per_kg_rblg

  - id: BAG-25KG
    name: Multiwall paper bag, 25 kg, PE liner
    type: purchased
    category: packaging
    uom: unit
    planning:
      lead_time: mock_packaging_lead_time
      on_hand: mock_start_cover_batches * powder_kg_per_batch * bags_per_kg_powder
      lot_sizing: {rule: lot_for_lot}

  - id: UFDF-MEMBRANE-SET
    name: UF/DF membrane set (10 kDa PES), consumable
    type: purchased
    category: consumable
    uom: unit
    planning:
      lead_time: mock_membrane_lead_time
      on_hand: mock_membrane_sets_on_hand
      lot_sizing: {rule: lot_for_lot, multiple: 1}

bom:
  - {parent: BLG-PWD, component: BLG-FERM, qty_per: rblg_kg_per_kg_product}
  - {parent: BLG-PWD, component: BAG-25KG, qty_per: bags_per_kg_powder}
  - {parent: BLG-PWD, component: UFDF-MEMBRANE-SET, qty_per: membrane_sets_per_kg_powder, basis: mock}
  - {parent: BLG-FERM, component: GLUCOSE, qty_per: sugar_kg_per_kg_rblg}
  - {parent: BLG-FERM, component: NH3, qty_per: nh3_kg_per_kg_rblg}
  - {parent: BLG-FERM, component: AMSULF, qty_per: ammonium_sulfate_kg_per_kg_rblg}
  - {parent: BLG-FERM, component: KPHOS, qty_per: potassium_phosphate_kg_per_kg_rblg}
  - {parent: BLG-FERM, component: MGSULF, qty_per: magnesium_sulfate_kg_per_kg_rblg}
  - {parent: BLG-FERM, component: CACL2, qty_per: calcium_chloride_kg_per_kg_rblg}

vendors:                       # used by the Odoo demo; all FICTIONAL
  - id: v_sugar
    name: "Sugar Vendor (fictional)"
    fictional: true
    supplies: [GLUCOSE, SUCROSE]
  - id: v_nutrients
    name: "Nutrients Vendor (fictional)"
    fictional: true
    supplies: [NH3, AMSULF, KPHOS, MGSULF, CACL2]
  - id: v_packaging
    name: "Packaging Vendor (fictional)"
    fictional: true
    supplies: [BAG-25KG]
  - id: v_membranes
    name: "Membrane Vendor (fictional)"
    fictional: true
    supplies: [UFDF-MEMBRANE-SET]

customers:                     # the demand side; all FICTIONAL
  - id: c_brands
    name: "Customer - Food Brand (fictional)"
    fictional: true
  - id: c_beverage
    name: "Customer - Beverage (fictional)"
    fictional: true
  - id: c_nutrition
    name: "Customer - Sports Nutrition (fictional)"
    fictional: true
  - id: c_distributor
    name: "Customer - Distributor (fictional)"
    fictional: true
  - id: c_copacker
    name: "Customer - Co-Packer (fictional)"
    fictional: true

variants:
  sucrose:                    # Behm et al. scenario 2: same process, sucrose feed
    substitute: {GLUCOSE: SUCROSE}

demand:
  mock: true                  # synthetic - not market data
  item: BLG-PWD
  base_per_period: mock_demand_base
  annual_growth: mock_demand_growth
  seasonal_amplitude: mock_demand_seasonal_amplitude
  seasonal_peak_month: mock_demand_peak_month
  noise_cv: mock_demand_noise_cv
  seed: 42                    # RNG seed (structural)
  orders:                     # MOCK order book for MPS / ATP
    booked_first: mock_orders_booked_week0
    decay: mock_orders_decay

sop:
  strategy: chase             # chase | level
  target_cover_months: mock_sop_target_cover_months
  capacity_per_week: powder_capacity_per_week      # rough-cut: fermenters are the constraint (ADR 0006)

mps:
  demand_time_fence: mock_demand_time_fence
  planning_time_fence: mock_pwd_lead_time + fermentation_lead_time_weeks   # cumulative lead time

resources:                    # rough-cut capacity (M4)
  - id: FERMENTERS
    name: 300 m3 production fermenters
    units: mock_production_reactors
    hours_per_week: hours_per_week
    availability: plant_uptime

bill_of_resources:            # fermenter hours per kg rBLG = cited 144 h cycle / 12,000 kg batch
  - {item: BLG-FERM, resource: FERMENTERS, hours_per_unit: fermentation_cycle_h / batch_rblg_kg}

rccp:
  level: true                 # pull whole batches earlier into weeks with spare fermenter time
  max_pull_forward: mock_rccp_max_pull_forward

purchasing:                   # M3: PO schedule + spend from FRED-linked prices
  price_window_years: mock_price_window_years

# ---------------------------------------------------------------------------
# M6 sourcing. Supplier master (consolidated 2026-11-27, ADR 0019): four PREFERRED
# partners, one per material family, and three APPROVED backups that each cover
# several families (economies of scale: one supplier, many items). Names say what
# a supplier sells; status (preferred / approved) and traits are tags in the ERP.
# Quote terms reuse the MOCK archetypes (incumbent / low-cost / premium / express);
# quotes are a price index on the should-cost target (ADR 0013), so no dollar quote
# is invented per supplier. All suppliers are FICTIONAL.
# ---------------------------------------------------------------------------
suppliers:
  - id: s_sweeteners
    name: "Corn Sweeteners Mill"
    fictional: true
    archetype: incumbent
    status: preferred
    tags: [Domestic]
    supplies: [GLUCOSE, SUCROSE]
    lane: domestic
    incoterm: DAP
    risk_tier: low
    quote: &q_incumbent
      price_index: mock_sup_inc_price_index
      lead_time_delta: mock_sup_inc_lead_time_delta
      moq_weeks: mock_sup_inc_moq_weeks
      quality_ppm: mock_sup_inc_quality_ppm
      otif: mock_sup_inc_otif
      lead_time_sigma: mock_sup_inc_lt_sigma
      short_ship_rate: mock_sup_inc_short_ship_rate

  - id: s_chemicals
    name: "Process Chemicals Distributor"
    fictional: true
    archetype: premium
    status: preferred
    tags: [Domestic, High quality]
    supplies: [NH3, AMSULF, KPHOS, MGSULF, CACL2]
    lane: domestic
    incoterm: DAP
    risk_tier: low
    quote: &q_premium
      price_index: mock_sup_prem_price_index
      lead_time_delta: mock_sup_prem_lead_time_delta
      moq_weeks: mock_sup_prem_moq_weeks
      quality_ppm: mock_sup_prem_quality_ppm
      otif: mock_sup_prem_otif
      lead_time_sigma: mock_sup_prem_lt_sigma
      short_ship_rate: mock_sup_prem_short_ship_rate

  - id: s_packaging
    name: "Packaging Converter"
    fictional: true
    archetype: low-cost
    status: preferred
    tags: [Import, Low cost]
    supplies: [BAG-25KG]
    lane: import
    incoterm: FOB
    risk_tier: medium
    quote: &q_packaging        # cheap and fast, with quality close to an incumbent's
      price_index: mock_sup_low_price_index
      lead_time_delta: mock_sup_pack_b_lead_time_delta
      moq_weeks: mock_sup_low_moq_weeks
      quality_ppm: mock_sup_pack_b_quality_ppm
      otif: mock_sup_low_otif
      lead_time_sigma: mock_sup_low_lt_sigma
      short_ship_rate: mock_sup_low_short_ship_rate

  - id: s_filtration
    name: "Filtration Systems Maker"
    fictional: true
    archetype: incumbent
    status: preferred
    tags: [Import, Original equipment]
    supplies: [UFDF-MEMBRANE-SET]
    lane: import
    incoterm: DAP
    risk_tier: medium
    quote: *q_incumbent

  - id: s_broadline
    name: "Broadline Ingredients Distributor"
    fictional: true
    archetype: low-cost
    status: approved
    tags: [Import, Low cost]
    supplies: [GLUCOSE, SUCROSE, NH3, AMSULF, KPHOS, MGSULF, CACL2]
    lane: import
    incoterm: FOB
    risk_tier: high
    quote: &q_low_cost
      price_index: mock_sup_low_price_index
      lead_time_delta: mock_sup_low_lead_time_delta
      moq_weeks: mock_sup_low_moq_weeks
      quality_ppm: mock_sup_low_quality_ppm
      otif: mock_sup_low_otif
      lead_time_sigma: mock_sup_low_lt_sigma
      short_ship_rate: mock_sup_low_short_ship_rate

  - id: s_express
    name: "Regional Express Supply"
    fictional: true
    archetype: express
    status: approved
    tags: [Domestic, Fast delivery]
    supplies: [GLUCOSE, SUCROSE, NH3, AMSULF, KPHOS, MGSULF, CACL2, BAG-25KG]
    lane: domestic
    incoterm: DDP
    risk_tier: low
    quote:
      price_index: mock_sup_exp_price_index
      lead_time_delta: mock_sup_exp_lead_time_delta
      moq_weeks: mock_sup_exp_moq_weeks
      quality_ppm: mock_sup_exp_quality_ppm
      otif: mock_sup_exp_otif
      lead_time_sigma: mock_sup_exp_lt_sigma
      short_ship_rate: mock_sup_exp_short_ship_rate

  - id: s_aftermarket
    name: "Aftermarket Membrane Supply"
    fictional: true
    archetype: low-cost
    status: approved
    tags: [Import, Low cost]
    supplies: [UFDF-MEMBRANE-SET]
    lane: import
    incoterm: FOB
    risk_tier: high
    quote: *q_low_cost

sourcing:
  weights:                     # RFQ award weights; must sum to 1 (ADR 0013)
    price: mock_rfq_weight_price
    lead_time: mock_rfq_weight_lead_time
    quality: mock_rfq_weight_quality
    risk: mock_rfq_weight_risk
  risk_scores:                 # risk tier -> score (1 = lowest risk)
    low: mock_risk_score_low
    medium: mock_risk_score_medium
    high: mock_risk_score_high
  lanes:                       # inbound freight and duty as a share of ex-works cost
    domestic: {freight_pct: mock_freight_pct_domestic, duty_pct: mock_duty_pct_domestic}
    import: {freight_pct: mock_freight_pct_import, duty_pct: mock_duty_pct_import}
  should_cost:                 # bottom-up target price (ADR 0014)
    conversion_pct: mock_conversion_pct
    margin_pct: mock_supplier_margin_pct
    material_base:             # used when no public price index is linked to the item
      GLUCOSE: mock_base_glucose
      SUCROSE: mock_base_sucrose
      NH3: mock_base_nh3
      AMSULF: mock_base_amsulf
      KPHOS: mock_base_kphos
      MGSULF: mock_base_mgsulf
      CACL2: mock_base_cacl2
      BAG-25KG: mock_base_bag25
      UFDF-MEMBRANE-SET: mock_base_membrane_set
    # the mock bases move with a cited US producer price index (BLS, via FRED):
    # price(month) = mock base x index(month) / index(index_base). Level mock, movement real.
    index_base: "2026-01-01"
    material_index:
      NH3: PCU325311325311               # PPI: nitrogenous fertilizer manufacturing
      AMSULF: PCU325311325311
      KPHOS: PCU325180325180             # PPI: other basic inorganic chemical manufacturing
      MGSULF: PCU325180325180
      CACL2: PCU325180325180
      BAG-25KG: PCU322220322220          # PPI: paper bag and coated/treated paper manufacturing
      UFDF-MEMBRANE-SET: PCU326199326199 # PPI: all other plastics products (proxy for PES membranes)
  order_lots:                  # minimums and kanban quantities round up to whole lots
    GLUCOSE: mock_lot_bulk_tanker_kg
    SUCROSE: mock_lot_bulk_tanker_kg
    BAG-25KG: mock_lot_bags_per_pallet
  carrying_cost_rate: mock_carrying_cost_rate
  quality_cost_multiple: mock_quality_cost_multiple
  scorecard_periods: mock_scorecard_periods
  price_drift_cv: mock_price_drift_cv
  short_ship_fraction: mock_short_ship_fraction
  dual_source_split: mock_dual_source_split
  disruption_prob_base: mock_disruption_prob_base
  disruption_weeks: mock_disruption_weeks
  forward_buy_weeks: mock_forward_buy_weeks
  service_level_z: service_level_z
  seed: 7                      # RNG seed for the simulated delivery history (structural)

# ---------------------------------------------------------------------------
# MOCK operating history (ADR 0018): weekly operations from `start` to `end` (the
# last full week before the backfill), written into the live ERP by
# scripts/odoo_history.py. Demand backcasts the plan's trend (growing into
# mock_demand_base by time.start); commodity prices are the cited FRED series.
# Dates and the seed are structural; every quantity is an id.
# ---------------------------------------------------------------------------
history:
  start: "2024-01-01"
  end: "2026-11-22"
  seed: 2024                   # RNG seed, separate from the plan's demand seed
  conversion_usd_per_kg: mock_conversion_usd_per_kg_powder
  gross_margin: mock_target_gross_margin
  reprice_every_months: mock_reprice_every_months   # list price follows current input costs
  order_lead_weeks: mock_customer_order_lead_weeks
  customer_terms_days: mock_customer_payment_terms_days
  vendor_terms_days: mock_vendor_payment_terms_days
  pay_days_cv: mock_pay_days_cv
  min_cover_weeks: mock_hist_min_cover_weeks
  safety_cover_weeks: mock_hist_safety_cover_weeks
  customers:
    c_brands:      {share: mock_cust_share_brands,      every_weeks: 1, pay_days: mock_pay_days_prompt, discount: mock_discount_key_account}
    c_beverage:    {share: mock_cust_share_beverage,    every_weeks: 1, pay_days: mock_pay_days_standard, discount: mock_discount_key_account}
    c_nutrition:   {share: mock_cust_share_nutrition,   every_weeks: mock_order_every_weeks_regular, pay_days: mock_pay_days_standard}
    c_distributor: {share: mock_cust_share_distributor, every_weeks: mock_order_every_weeks_monthly, pay_days: mock_pay_days_slow, discount: mock_discount_distributor}
    c_copacker:    {share: mock_cust_share_copacker,    every_weeks: mock_order_every_weeks_regular, pay_days: mock_pay_days_prompt}
  events:
    - kind: contamination
      start: "2025-03-10"
      size: 1                  # one fermentation batch lost
      note: "Contaminated fermentation batch, scrapped [mock]"
    - kind: supplier_outage
      start: "2025-08-04"
      weeks: mock_event_outage_weeks
      target: s_sweeteners
      item: GLUCOSE
      note: "Glucose supplier outage; emergency buys from the runner-up [mock]"
    - kind: demand_spike
      start: "2026-05-04"
      weeks: mock_event_spike_weeks
      size: mock_event_spike_uplift
      target: c_beverage
      note: "Unforecast beverage launch volume [mock]"
