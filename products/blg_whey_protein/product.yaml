# Case 1 - MOCK precision-fermentation plant: recombinant beta-lactoglobulin (rBLG)
# whey protein powder made by Trichoderma reesei fed-batch fermentation.
#
# Rules (see CLAUDE.md):
#   parameters: process facts - each one cites a public source + locator
#   derived:    arithmetic on cited parameters only
#   planning:   inventory / lot-size / non-process lead-time ASSUMPTIONS (mock)
#   demand:     MOCK
# Derivations and caveats are explained in SOURCES.md next to this file.

product:
  id: blg_whey_protein
  name: "rBLG whey protein powder - mock precision-fermentation plant"
  mock: true

time:
  freq: W-SUN        # weekly buckets, Mon-Sun
  start: "2027-01-04"
  horizon: 26

sources:
  behm2022:
    citation: >-
      Behm K, Nappa M, Aro N, Welman A, Ledgard S, Suomalainen M, Hill J (2022).
      Comparison of carbon footprint and water scarcity footprint of milk protein
      produced by cellular agriculture and the dairy industry.
      Int J Life Cycle Assess 27:1017-1034
    url: https://doi.org/10.1007/s11367-022-02087-0
    license: CC BY 4.0
  behm2022_esm:
    citation: >-
      Behm et al. (2022), Online Resource (Supplementary file 1), Data 1:
      additional process description details for mass and energy balance
    url: https://doi.org/10.1007/s11367-022-02087-0
    license: CC BY 4.0
  epa_ap42_9_9_7:
    citation: >-
      US EPA, AP-42 Compilation of Air Emissions Factors, Section 9.9.7
      Corn Wet Milling
    url: https://www.epa.gov/sites/default/files/2020-10/documents/c9s09-7.pdf
    license: US Government work
  ciaaw:
    citation: >-
      IUPAC Commission on Isotopic Abundances and Atomic Weights (CIAAW),
      standard atomic weights (conventional values C 12.011, H 1.008, O 15.999)
    url: https://www.ciaaw.org/atomic-weights.htm
  nist_sp811:
    citation: >-
      NIST Special Publication 811, Guide for the Use of the International System
      of Units (SI), Appendix B (conversion factors)
    url: https://www.nist.gov/pml/special-publication-811
    license: US Government work

parameters:
  # --- fermentation (Behm et al. 2022, base scenario 1) ---
  final_titre_rblg:
    value: 50
    unit: g/L
    source: behm2022
    locator: "Sect. 2.4 Process description"
  rblg_fraction_of_secreted_protein:
    value: 0.90
    unit: fraction
    source: behm2022
    locator: "Sect. 2.4 Process description"
  protein_yield_on_sugar:
    value: 0.223
    unit: g protein / g sugar
    source: behm2022
    locator: "Sect. 2.4 Process description (base case)"
    note: >-
      Interpreted as total secreted protein per sugar fed (total-protein productivity
      0.46 vs rBLG 0.42 g/L/h in the same paragraph). See SOURCES.md.
  final_fungal_biomass:
    value: 30
    unit: g/L
    source: behm2022
    locator: "Sect. 2.4 Process description"
  production_time:
    value: 120
    unit: h
    source: behm2022
    locator: "Sect. 2.4 Process description"
  turnaround_time:
    value: 24
    unit: h
    source: behm2022
    locator: "Sect. 2.4 Process description (offline period: draining, cleaning, refilling)"
  main_bioreactor_volume:
    value: 300
    unit: m3
    source: behm2022
    locator: "Sect. 2.4 Process description"

  # --- downstream processing ---
  mf_permeate_recovery:
    value: 0.975
    unit: fraction
    source: behm2022_esm
    locator: "Data 1 (microfiltration); also Sect. 2.4"
    note: UF/DF assumed 100% protein retention in the same source.
  rblg_content_of_product:
    value: 0.858
    unit: kg rBLG / kg product
    source: behm2022
    locator: "Sect. 2.1 Scope of the study (90% purity x 95% dry matter)"

  # --- corn -> glucose conversion (for pricing glucose off the corn index) ---
  corn_per_bushel:
    value: 25
    unit: kg
    source: epa_ap42_9_9_7
    locator: "Sect. 9.9.7.1 General (average bushel, 56 lb)"
  starch_per_bushel:
    value: 14
    unit: kg
    source: epa_ap42_9_9_7
    locator: "Sect. 9.9.7.1 General (32 lb starch per bushel)"
  glucose_molar_mass:
    value: 180.156
    unit: g/mol
    source: ciaaw
    locator: "C6H12O6 from conventional atomic weights"
  anhydroglucose_molar_mass:
    value: 162.141
    unit: g/mol
    source: ciaaw
    locator: "C6H10O5 (starch repeat unit) from conventional atomic weights"

  # --- units ---
  kg_per_lb:
    value: 0.45359237
    unit: kg/lb
    source: nist_sp811
    locator: "Appendix B.9, pound (avoirdupois) - exact"

derived:
  rblg_kg_per_kg_product:
    expr: rblg_content_of_product / mf_permeate_recovery
  sugar_kg_per_kg_rblg:
    expr: 1 / (protein_yield_on_sugar * rblg_fraction_of_secreted_protein)
  fermentation_cycle_h:
    expr: production_time + turnaround_time
  batch_rblg_kg_at_full_volume:
    expr: main_bioreactor_volume * final_titre_rblg   # m3 * g/L = kg; upper bound (working volume not sourced)
  hydrolysis_mass_gain:
    expr: glucose_molar_mass / anhydroglucose_molar_mass
  corn_kg_per_glucose_kg:
    # theoretical minimum: 100% hydrolysis, no refining losses
    expr: (corn_per_bushel / starch_per_bushel) / hydrolysis_mass_gain

items:
  - id: BLG-PWD
    name: rBLG protein powder (85.8% rBLG)
    type: finished
    uom: kg
    planning:
      basis: assumption
      lead_time: 1            # DSP, spray drying, QA release - assumption
      on_hand: 60000
      safety_stock: 20000
      scheduled_receipts: {0: 25000}
      lot_sizing: {rule: lot_for_lot}

  - id: BLG-FERM
    name: rBLG secreted in harvested broth (kg rBLG)
    type: intermediate
    uom: kg
    planning:
      basis: derived
      lead_time: ceil(fermentation_cycle_h / 168)   # weekly buckets
      on_hand: 0
      scheduled_receipts: {0: 30000}                # batches already running - assumption
      lot_sizing: {rule: lot_for_lot}               # batch sizing arrives with RCCP

  - id: GLUCOSE
    name: Glucose (corn-derived), carbon source - Behm scenario 1
    type: purchased
    uom: kg
    price:
      series: PMAIZMTUSDM                            # USD per metric ton of corn
      usd_per_uom: PMAIZMTUSDM / 1000 * corn_kg_per_glucose_kg   # corn content only
    planning:
      basis: assumption
      lead_time: 2
      on_hand: 400000
      safety_stock: 150000
      scheduled_receipts: {1: 250000}
      lot_sizing: {rule: fixed_order_quantity, quantity: 250000}

  - id: SUCROSE
    name: Sucrose, carbon source - Behm scenario 2
    type: purchased
    uom: kg
    price:
      series: PSUGAISAUSDM                           # US cents per pound, ICE No. 11
      usd_per_uom: PSUGAISAUSDM / 100 / kg_per_lb
    planning:
      basis: assumption
      lead_time: 2
      on_hand: 400000
      safety_stock: 150000
      scheduled_receipts: {1: 250000}
      lot_sizing: {rule: fixed_order_quantity, quantity: 250000}

bom:
  - {parent: BLG-PWD, component: BLG-FERM, qty_per: rblg_kg_per_kg_product}
  - {parent: BLG-FERM, component: GLUCOSE, qty_per: sugar_kg_per_kg_rblg}

variants:
  sucrose:                    # Behm et al. scenario 2: same process, sucrose feed
    substitute: {GLUCOSE: SUCROSE}

demand:
  mock: true                  # synthetic - not market data
  item: BLG-PWD
  base_per_period: 30000      # kg / week at the start of the horizon
  annual_growth: 0.15
  seasonal_amplitude: 0.10
  seasonal_peak_month: 11
  noise_cv: 0.08
  seed: 42
